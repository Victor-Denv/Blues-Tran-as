<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blues Afrotrancas | Agendamento</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1>Blues Afrotrancas</h1>
            <p>Sua coroa, nossa arte. Realce sua beleza com as tranças perfeitas.</p>
            <a href="#agendamento" class="btn-hero">Agendar Agora</a>
        </div>
    </header>

    <div class="container" id="agendamento">
        <div class="form-header">
            <h2>Faça seu Agendamento</h2>
            <p>Preencha seus dados para garantir a vaga</p>
        </div>

        <div class="content">
            <div id="dateAlert" class="alert-box" style="display: none;"></div>

            <div class="step">
                <label class="step-title"><span class="material-icons">person</span> Seus Dados</label>
                <input type="text" id="clientName" placeholder="Nome Completo" required>
                <input type="tel" id="clientPhone" placeholder="WhatsApp (com DDD)" required>
                <input type="text" id="clientAddress" placeholder="Endereço (Bairro/Rua)" required>
                
                <label style="font-size: 12px; color: #666; margin-top: 10px; display:block;">Quando foi seu último procedimento no cabelo?</label>
                <input type="date" id="lastProcedureDate" required>
            </div>

            <div class="step">
                <label class="step-title"><span class="material-icons">event</span> Data do Agendamento</label>
                <div class="input-group">
                    <input type="date" id="dateInput" required>
                    <input type="time" id="timeInput" required>
                </div>
            </div>

            <div class="step">
                <label class="step-title"><span class="material-icons">face</span> Escolha o Modelo</label>
                <select id="serviceSelect">
                    <option value="0">Selecione o estilo...</option>
                    
                    <optgroup label="Tranças Nagô">
                        <option value="40">Nagô Lateral - R$ 40,00</option>
                        <option value="50">Nagô Tiara - R$ 50,00</option>
                        <option value="35">Nagô Topo - R$ 35,00</option>
                        <option value="95">Nagô c/ Jumbo (Todo cabelo) - R$ 95,00</option>
                        <option value="80">Nagô s/ Jumbo (Todo cabelo) - R$ 80,00</option>
                        <option value="160">Nagô Desenhada (Channa c/ Jumbo) - R$ 160,00</option>
                        <option value="90">Nagô Desenhada (Channa s/ Jumbo) - R$ 90,00</option>
                        <option value="180">Mohawk Braids (Moicano) - R$ 180,00</option>
                        <option value="180">Fulani Braids - R$ 180,00</option>
                    </optgroup>

                    <optgroup label="Tranças Soltas">
                        <option value="190">Box Braids (Com nó) - R$ 190,00</option>
                        <option value="190">Knotless Braids (Sem nó) - R$ 190,00</option>
                        <option value="160">Chanel - R$ 160,00</option>
                        <option value="200">Gipsy / Goddess Braids - R$ 200,00</option>
                    </optgroup>

                    <optgroup label="Locs & Outros">
                        <option value="85">Manutenção Locs (Retwist) - R$ 85,00</option>
                        <option value="90">Twist/Start Locs - A partir de R$ 90,00</option>
                        <option value="130">Faux Locs Individuais - R$ 130,00</option>
                        <option value="180">Entrelace - R$ 180,00</option>
                        <option value="130">Crochet Braids - R$ 130,00</option>
                    </optgroup>
                </select>
            </div>

            <div class="step id-hidden" id="paymentSection">
                <label class="step-title"><span class="material-icons">payments</span> Resumo</label>
                <div class="summary-card">
                    <div class="price-row">
                        <span>Serviço:</span>
                        <span id="fullPrice">R$ 0,00</span>
                    </div>
                    <div class="total-row">
                        <span>Sinal (30%):</span>
                        <span id="depositPrice">R$ 0,00</span>
                    </div>
                    <p class="pix-note">Pague o sinal via PIX para confirmar.</p>
                </div>
            </div>

            <button class="btn-whatsapp" id="btnSend">
                Verificar e Agendar
            </button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Blues Afrotrancas. <a href="admin.html">Área Restrita</a></p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
