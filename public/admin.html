<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Blues Afrotranças</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
</head>
<body>

    <div id="loginScreen" class="login-wrapper">
        <div class="login-card">
            <h2>Área Restrita 🔒</h2>
            <p style="color:#ccc; margin-bottom:20px">Acesso exclusivo da administração</p>
            <input type="password" id="adminPass" placeholder="Senha de Acesso">
            <button class="btn-login" onclick="entrar()">Entrar</button>
        </div>
    </div>

    <div id="dashboard" style="display: none;">
        
        <header class="header-admin">
            <div class="logo">Agenda Blues 💙</div>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </header>

        <nav class="nav-container">
            <button class="nav-btn active" onclick="mudarAba('agendado', this)">
                <i class="fas fa-calendar-alt"></i> Calendário
            </button>
            <button class="nav-btn" onclick="mudarAba('historico', this)">
                <i class="fas fa-history"></i> Histórico
            </button>
            <button class="nav-btn" onclick="mudarAba('config', this)">
                <i class="fas fa-cog"></i> Configurar
            </button>
        </nav>

        <section id="tabAgendados" class="tab-content">
            <div class="container-centralizado">
                <div class="admin-card">
                    <h3 style="margin-bottom: 15px; color: var(--neon-blue);">Agendamentos Futuros</h3>
                    <div id="calendar"></div>
                </div>
            </div>
        </section>

        <section id="tabHistorico" class="tab-content" style="display: none;">
            <div class="container-centralizado">
                
                <div class="admin-card" style="margin-bottom: 30px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="color: #10b981; margin: 0;">Calendário de Concluídos</h3>
                        <button onclick="limparHistorico()" class="btn-cancelar" style="font-size: 0.8rem;">
                            <i class="fa-solid fa-trash-can"></i> Limpar Tudo
                        </button>
                    </div>
                    <div id="calendar-history"></div>
                </div>

                <div class="admin-card">
                    <h3 style="margin-bottom: 15px;">Lista Detalhada</h3>
                    <div id="listaHistorico"></div>
                </div>
            </div>
        </section>

        <section id="tabConfig" class="tab-content" style="display: none;">
            <div class="container-centralizado">
                <div class="admin-card">
                    <h2>Configurar Dias Livres</h2>
                    <p style="color:#ccc; margin-bottom: 15px;">Defina onde você vai atender (Feira ou Camaçari).</p>
                    
                    <div class="input-row">
                        <input type="date" id="dataConfig">
                        <select id="localConfig">
                            <option value="Feira de Santana - BA">Feira de Santana</option>
                            <option value="Camaçari - BA">Camaçari</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <input type="time" id="horaInicioConfig" value="08:00">
                        <input type="time" id="horaFimConfig" value="18:00">
                    </div>
                    <button class="btn-login" onclick="adicionarDia()" style="margin-top:10px;">Liberar Dia</button>

                    <div id="listaDiasLiberados" style="margin-top: 30px;"></div>
                </div>
            </div>
        </section>

    </div>

    <div id="modalDetalhes" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="fecharModalDetalhes()">&times;</button>
            
            <div class="modal-header">
                <h3>Detalhes</h3>
            </div>

            <div class="modal-info">
                <p><strong>Cliente:</strong> <span id="mNome">...</span></p>
                <p><strong>Serviço:</strong> <span id="mServico">...</span></p>
                <p><strong>Data:</strong> <span id="mData">...</span></p>
                <p><strong>Horário:</strong> <span id="mHora">...</span></p>
                <p><strong>Telefone:</strong> <span id="mTel">...</span></p>
            </div>

            <div class="modal-actions">
                <button class="btn-modal btn-wpp" onclick="abrirWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </button>
                <button id="btnConfirmarPix" class="btn-modal btn-confirm-pix" onclick="confirmarPix()">
                    <i class="fa-solid fa-dollar-sign"></i> Confirmar PIX
                </button>
                <button id="btnConcluir" class="btn-modal btn-concluir" onclick="concluirAtendimento()">
                    <i class="fa-solid fa-circle-check"></i> Concluir Atendimento
                </button>
                <button class="btn-modal btn-cancel" onclick="cancelarAgendamento()">
                    <i class="fa-solid fa-trash"></i> Cancelar
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
