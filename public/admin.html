<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Blues Afrotrancas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* CSS ESPECÍFICO DO ADMIN */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn {
            background: transparent; border: 1px solid var(--primary-blue); color: #fff;
            padding: 10px 30px; border-radius: 50px; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary-blue); color: white; box-shadow: 0 0 15px var(--primary-blue);
        }
        .btn-pix {
            width: 100%; padding: 8px; border: 1px solid #10b981; background: rgba(16, 185, 129, 0.1);
            color: #10b981; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 5px;
            transition: 0.3s;
        }
        .btn-pix:hover { background: #10b981; color: white; }
        .badge-pix {
            background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 8px;
            border-radius: 8px; text-align: center; font-weight: bold; font-size: 0.9rem;
            border: 1px solid #10b981; margin-bottom: 5px;
        }
        .border-green { border-color: #10b981 !important; }
        .btn-concluir {
            width: 100%; margin-top: 5px; padding: 10px; border: none; border-radius: 8px;
            background: #2d3748; color: #a0aec0; cursor: pointer; font-weight: bold; transition:0.3s;
        }
        .btn-concluir:hover { background: var(--primary-blue); color: white; }
        /* Botão de Resumo para a Trancista */
.btn-resumo-trancista {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.btn-resumo-trancista:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}
    </style>
</head>
<body>

    <div class="bg-glow one" style="opacity: 0.2;"></div>

    <div id="loginScreen" class="login-wrapper">
        <div class="login-card">
            <div class="logo">BLUES<span>ADMIN</span></div>
            <p>Acesso restrito</p>
            <input type="password" id="adminPass" placeholder="Senha">
            <button onclick="entrar()" class="btn-login">Entrar</button>
        </div>
    </div>

    <div id="dashboard" style="display: none;">
        <header class="dashboard-header">
            <div class="logo-area"><h2>Agenda Blues 💙</h2></div>
            <button onclick="sair()" class="btn-logout">Sair</button>
        </header>

        <div class="dashboard-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="mudarAba('agendado')" id="tabAgendados">Próximos</button>
                <button class="tab-btn" onclick="mudarAba('concluido')" id="tabHistorico">Histórico</button>
            </div>

            <div id="listaAgendamentos">
                <p style="text-align: center; color: #888;">Carregando...</p>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
